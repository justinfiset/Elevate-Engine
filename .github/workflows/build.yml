name: Build Elevate Engine

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Never cancel a run on main: it may be the one that deploys.
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build-linux:
        name: Linux / ${{ matrix.compiler.name }} / ${{ matrix.configuration }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                configuration: [Editor_Debug, Editor_Release, Release]
                compiler:
                    - name: clang
                      preset: linux-clang
                      cc: clang-18
                      cxx: clang++-18
                    - name: gcc
                      preset: linux-gcc
                      cc: gcc-15
                      cxx: g++-15

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  submodules: recursive

            - name: Install Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev
                  if [ "${{ matrix.compiler.name }}" = "clang" ]; then
                    sudo apt-get install -y clang-18 clang-tools-18 lld-18 libc++-18-dev libc++abi-18-dev
                  else
                    # GCC 15 includes the PR105443 modules location-exhaustion
                    # fix; GCC 14 ICEs on this project's module graph.
                    sudo apt-get install -y software-properties-common
                    sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
                    sudo apt-get update
                    sudo apt-get install -y gcc-15 g++-15
                  fi

            - name: Configure
              run: |
                  cmake --preset ${{ matrix.compiler.preset }} \
                    -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
                    -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
                    -DEE_ENABLE_WWISE=OFF

            - name: Compile
              run: cmake --build Build/${{ matrix.compiler.preset }} --config ${{ matrix.configuration }} -j "$(nproc)"

            - name: Run tests
              run: |
                  ./Build/bin/${{ matrix.configuration }}-linux-x86_64/ElevateEngine-Tests/ElevateEngine-Tests -r junit -o junit-results-linux-${{ matrix.compiler.name }}-${{ matrix.configuration }}.xml

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: allure-results-linux-${{ matrix.compiler.name }}-${{ matrix.configuration }}
                  path: junit-results-linux-${{ matrix.compiler.name }}-${{ matrix.configuration }}.xml
                  if-no-files-found: ignore

    build-windows:
        name: Windows / MSVC / ${{ matrix.configuration }}
        # MSVC 14.52 has a C++20 modules regression (C2572 on STL declarations
        # shared through global module fragments). windows-2022 provides the
        # validated MSVC 14.44 toolset; cl.exe is still selected explicitly.
        runs-on: windows-2022
        strategy:
            fail-fast: false
            matrix:
                configuration: [Editor_Debug, Editor_Release, Release]

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  submodules: recursive

            - name: Setup MSVC
              uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
              with:
                  arch: x64

            - name: Setup Ninja
              uses: ashutoshvarma/setup-ninja@93f8b9763516f1fb9b4d9840b12d844bee17791f # v1.1
              with:
                  version: 1.12.1

            # Ninja is only the build driver. The compiler is MSVC (cl.exe),
            # put on PATH by the msvc-dev-cmd step above.
            - name: Configure
              run: cmake --preset windows-msvc -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DEE_ENABLE_WWISE=OFF

            - name: Compile
              run: cmake --build Build/windows-msvc --config ${{ matrix.configuration }} -j $env:NUMBER_OF_PROCESSORS

            - name: Run tests
              run: |
                  .\Build\bin\${{ matrix.configuration }}-windows-x86_64\ElevateEngine-Tests\ElevateEngine-Tests -r junit -o junit-results-windows-${{ matrix.configuration }}.xml

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: allure-results-windows-${{ matrix.configuration }}
                  path: junit-results-windows-${{ matrix.configuration }}.xml
                  if-no-files-found: ignore

    build-web:
        name: Web / ${{ matrix.configuration }}
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                configuration: [Editor_Debug, Editor_Release, Release]

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  submodules: recursive

            - name: Setup Ninja
              uses: ashutoshvarma/setup-ninja@93f8b9763516f1fb9b4d9840b12d844bee17791f # v1.1
              with:
                  version: 1.12.1

            - name: Setup emsdk
              uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
              with:
                  version: "latest"
                  actions-cache-folder: "emsdk-cache"

            - name: Verify Emscripten
              run: emcc -v

            - name: Configure
              run: cmake --preset web -DEE_ENABLE_WWISE=OFF

            - name: Compile
              run: cmake --build Build/web --config ${{ matrix.configuration }} -j $env:NUMBER_OF_PROCESSORS

            # Only the two release web builds are deployed.
            - name: Upload web build
              if: matrix.configuration != 'Editor_Debug'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: web-${{ matrix.configuration }}
                  path: Build/bin/${{ matrix.configuration }}-emscripten-wasm32/

    docs:
        name: Docs / Doxygen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  submodules: recursive

            - name: Install Doxygen
              run: |
                  sudo apt-get update
                  sudo apt-get install -y doxygen

            - name: Generate Doxygen Docs
              run: doxygen Docs/Doxyfile

            - name: Upload Docs Artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: docs-site
                  path: Docs/html/

    deploy:
        name: Deploy / GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [build-linux, build-windows, build-web, docs]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Download Docs Artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: docs-site
                  path: public

            - name: Download Web Editor Build
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: web-Editor_Release
                  path: public/editor

            - name: Download Web Runtime Build
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: web-Release
                  path: public/runtime

            - name: Download Allure Results
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  path: allure-results
                  merge-multiple: true
                  pattern: allure-results-*

            - name: Clean JUnit XML
              run: |
                  # Delete everything after </testsuites> to prevent parsing errors
                  for f in allure-results/*.xml; do
                      sed -i 's/<\/testsuites>.*/<\/testsuites>/' "$f"
                  done
                  ls -l allure-results

            - name: Generate Allure Test Report
              uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459 # master
              if: always()
              id: allure-report
              with:
                  allure_results: allure-results
                  allure_report: public/tests
                  allure_history: allure-history

            - name: Deploy to GitHub Pages
              uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
              with:
                  folder: public
                  branch: gh-pages
                  clean: true
