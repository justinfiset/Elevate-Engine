name: Build Elevate Engine Release

on: [pull_request]

jobs:
    build-linux:
        runs-on: ubuntu-latest
        env:
            CC: clang-19
            CXX: clang++-19
        strategy:
            fail-fast: false
            matrix:
                include:
                    - configuration: Editor_Release
                      make_config: editor_release
                    - configuration: Release
                      make_config: release

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Dependencies
              run: |
                  wget https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh 19
                  sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

            - name: Cleanup Project
              run: rm -rf Build/ bin/ bin-int/

            - name: Generate Projects (Premake)
              run: |
                  chmod +x vendor/premake/premake5-linux
                  ./vendor/premake/premake5-linux --os=linux gmake

            - name: Display compiler environment
              run: |
                  echo "CXX=${CXX:-not set}"
                  which clang++-19
                  clang++-19 --version
                  clang++-19 -v -E -x c++ /dev/null
                  clang++-19 -print-file-name=libstdc++.so

            - name: Compile
              run: |
                  make config=${{ matrix.make_config }} -j"$(nproc)"

            - name: Run tests
              run: |
                  ./Build/bin/${{ matrix.configuration }}-linux-x86_64/ElevateEngine-Tests/ElevateEngine-Tests -r junit -o junit-results.xml

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results-linux-${{ matrix.configuration }}
                  path: junit-results.xml
                  if-no-files-found: ignore

    build-windows:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                configuration:
                    - Editor_Release
                    - Release

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup MSBuild
              uses: microsoft/setup-msbuild@v2

            - name: Generate Projects (Premake)
              run: ./vendor/premake/premake5.exe --os=windows vs2022

            - name: Compile
              run: msbuild ElevateEngine.sln /p:Configuration="${{ matrix.configuration }}"

            - name: Run tests
              run: |
                  .\Build\bin\${{ matrix.configuration }}-windows-x86_64\ElevateEngine-Tests\ElevateEngine-Tests -r junit -o junit-results.xml

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results-windows-${{ matrix.configuration }}
                  path: junit-results.xml
                  if-no-files-found: ignore

    build-web-windows-ninja:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                configuration:
                    - Editor_Release
                    - Release

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup Ninja
              uses: ashutoshvarma/setup-ninja@master
              with:
                  version: 1.12.1

            - name: Setup emsdk
              uses: emscripten-core/setup-emsdk@v15
              with:
                  version: "latest"
                  actions-cache-folder: "emsdk-cache"

            - name: Verify
              run: emcc -v

            - name: Generate Projects (Premake)
              run: ./vendor/premake/premake5.exe --os=emscripten ninja

            - name: Create Wrappers and Compile
              shell: pwsh
              run: |
                  if (Test-Path "$env:EMSDK\emsdk_env.ps1") {
                      & "$env:EMSDK\emsdk_env.ps1"
                  }

                  Add-Content -Path $env:GITHUB_PATH -Value "$env:EMSDK"
                  Add-Content -Path $env:GITHUB_PATH -Value "$env:EMSDK\upstream\emscripten"

                  $emscriptenDir = "$env:EMSDK\upstream\emscripten"

                  Set-Content -Path "$emscriptenDir\em++.bat" -Value "@echo off`npython `"$emscriptenDir\em++.py`" %*"
                  Set-Content -Path "$emscriptenDir\emcc.bat" -Value "@echo off`npython `"$emscriptenDir\emcc.py`" %*"
                  Set-Content -Path "$emscriptenDir\emar.bat" -Value "@echo off`npython `"$emscriptenDir\emar.py`" %*"
                  Set-Content -Path "$emscriptenDir\emranlib.bat" -Value "@echo off`npython `"$emscriptenDir\emranlib.py`" %*"

                  $env:PATH = "$emscriptenDir;" + $env:PATH

                  ninja -j $env:NUMBER_OF_PROCESSORS ${{ matrix.configuration }}
